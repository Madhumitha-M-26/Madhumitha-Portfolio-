name: Validate HTML and CSS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for validation tools
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install validation tools
        run: |
          npm install --global htmlhint csslint

      - name: Validate HTML
        run: htmlhint "*.html" --config .htmlhintrc

      - name: Validate CSS
        run: csslint css/*.css --quiet

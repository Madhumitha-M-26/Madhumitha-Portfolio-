name: Pull Request Quality Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  check-html-titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML title tags
        run: |
          for file in *.html; do
            if ! grep -q "<title>" "$file"; then
              echo "ERROR: $file is missing a title tag"
              exit 1
            fi
          done
          echo "All HTML files have title tags."

  check-image-alt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check image alt attributes
        run: |
          MISSING=$(grep -rn '<img' --include='*.html' . | grep -v 'alt=' || true)
          if [ -n "$MISSING" ]; then
            echo "ERROR: Images missing alt attributes:"
            echo "$MISSING"
            exit 1
          fi
          echo "All images have alt attributes."

  check-no-console-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript for console.log
        run: |
          if grep -rn "console.log" js/*.js; then
            echo "ERROR: Remove console.log before merging."
            exit 1
          fi
          echo "No console.log statements found."

  all-checks-passed:
    runs-on: ubuntu-latest
    needs: [check-html-titles, check-image-alt, check-no-console-log]
    steps:
      - name: Confirm quality checks
        run: echo "All PR checks passed. Ready for review."
